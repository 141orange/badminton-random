<html lang="en"><head><meta charset="utf-8">

<style>

:root[data-theme="dark"]{--bg:#0c1226;--card:#121c38}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:"Courier New",Courier,monospace;font-weight:700;-webkit-user-select:none;user-select:none}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}

</style></head><body>
<div id="wrap"><div id="st"><canvas id="c" width="200" height="112"></canvas><div id="ov"></div>
<button class="ib" id="mb" aria-label="Sound">♪</button><button class="ib" id="pb" aria-label="Pause">II</button></div></div>
<script>
let cx=document.getElementById('c').getContext('2d');
const cv=document.getElementById('c'),st=document.getElementById('st'),ov=document.getElementById('ov'),wrap=document.getElementById('wrap'),pb=document.getElementById('pb'),mb=document.getElementById('mb');
const W=800,H=448,GY=388,NX=400,R=8,L=80,SW=.4,WIN=5,HR=46;
const PD={j:1,s:330,b:0},PERS=[{j:1,s:330,b:0},{j:.7,s:290,b:0},{j:1.3,s:400,b:0},{j:0,s:340,b:0},{j:1,s:330,b:.04},{j:1,s:330,b:-.03}];
let sg=0,mus=true,NT=300,G=900,RK=1,PS=1,RY=194,LY=279,ts=1,rec=[],ridx=0,rw=0,pr=0,rc=0,ST={m:0,w:0,l:0,h:0,k:{},lr:0},pv=1,pu=true,act=[],CEIL=0,gmode='match',pers=PD,pp=true,cb=false,K={1:'KeyW',2:'ArrowUp'},S2={best:0},rebind=0,lastN=0;
let mode=1,state='menu',paused=false,timer=0,server=0,shake=0,banner='',hint=0,onHit=null,onPt=null;
let P=[],ball=null,texts=[],parts=[];
const mk=s=>({side:s,dir:s?-1:1,home:s?610:190,x:s?610:190,vx:0,sw:-1,cd:0,hit:false,score:0,cpu:false,walk:0,hx:0,aim:null,plan:0,pb:-1,dm:1e9,pm:0,tk:-1,
 jc:cb?(s?'#0072b2':'#e69f00'):(s?'#2a9df4':'#d7262f'),sk:s?'#f7c9a0':'#e3a070',hr:s?'#f2c94c':'#2b1d1a'});
P=[mk(0),mk(1)];
const names=()=>['P1',mode==1?'CPU':'P2'];
function fit(){const w=Math.min(wrap.clientWidth,wrap.clientHeight*W/H),h=w*H/W;st.style.width=w+'px';st.style.height=h+'px';st.style.fontSize=w/46+'px'}
addEventListener('resize',fit);
// ---------- audio
let AC=null,mute=false;
function au(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,ty,v,sl,dl){if(mute||!AC)return;const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);
 if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function nz(d,v,fq){if(mute||!AC)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=fq;s.buffer=b;g.gain.value=v;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}
function sfx(n,a){switch(n){
 case'swing':nz(.12,.1,1800);break;
 case'hit':if(a==='PERFECT!'){cheer(.16,.8);nz(.15,.25,900);tone(700,.18,'square',.08,900);tone(1400,.25,'triangle',.07,0,.08);tone(2100,.3,'triangle',.05,0,.16)}
  else if(a==='GOOD'){nz(.08,.2,1200);tone(620,.1,'square',.07,200)}else if(a==='SAVE'){nz(.08,.18,700);tone(420,.12,'triangle',.08,150)}else{nz(.1,.12,500);tone(220,.18,'sawtooth',.05,-120)}break;
 case'net':tone(110,.14,'triangle',.1,-40);nz(.08,.1,300);break;
 case'bounce':tone(150,.08,'triangle',.07,-50);break;
 case'tick':tone(1500,.03,'square',.035);break;
 case'beep':tone(660,.08,'square',.05);break;
 case'point':cheer(.22,1.2);[523,659,784].forEach((f,i)=>tone(f,.14,'square',.06,0,i*.1));break;
 case'bad':tone(300,.25,'sawtooth',.06,-150);break;
 case'pu':[392,523,659,880].forEach((f,i)=>tone(f,.1,'triangle',.07,0,i*.06));break;
 case'win':[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.18,'square',.07,0,i*.14));cheer(.4,2.4)}}
function cheer(v,d){if(mute||!AC)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++){const t=i/n;a[i]=(Math.random()*2-1)*Math.sin(Math.PI*Math.pow(t,.6))*(.6+.4*Math.sin(i/900))}
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=900;f.Q.value=.6;s.buffer=b;g.gain.value=v;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}
const LEAD=[12,null,15,17,19,null,17,15,12,null,10,12,15,null,12,null];let nt=0,ms=0;
function music(){if(!AC||mute||!mus||paused){nt=0;return}const now=AC.currentTime;if(nt<now)nt=now+.05;
 while(nt<now+.2){const dl=nt-now,i=ms%16;if(i%2==0)tone(65.4*Math.pow(2,[0,0,7,7,5,5,7,3][i>>1]/12),.18,'triangle',.05,0,dl);const l=LEAD[i];if(l!=null)tone(261.6*Math.pow(2,l/12),.14,'square',.02,0,dl);ms++;nt+=.19}}
setInterval(music,80);
// ---------- pixel helpers (world coords, snapped to 4-unit pixels; canvas is scaled 1/4)
const S=v=>Math.round(v/4)*4;
function B(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(S(x),S(y),Math.max(4,S(w)),Math.max(4,S(h)))}
function seg(x1,y1,x2,y2,w,c){cx.fillStyle=c;const n=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)/3));for(let i=0;i<=n;i++)cx.fillRect(S(x1+(x2-x1)*i/n-w*2),S(y1+(y2-y1)*i/n-w*2),w*4,w*4)}
function disc(x,y,r,c){cx.fillStyle=c;x=S(x);y=S(y);for(let dy=-r;dy<=r;dy++){const dx=Math.round(Math.sqrt(r*r+r*.8-dy*dy));cx.fillRect(x-dx*4,y+dy*4,(2*dx+1)*4,4)}}
function ringpx(x,y,r,c,dash){cx.fillStyle=c;for(let a=0,i=0;a<6.283;a+=.1,i++){if(dash&&i%2)continue;cx.fillRect(S(x+Math.cos(a)*r),S(y+Math.sin(a)*r),4,4)}}
const F={};'A:010101111101101,B:110101110101110,C:011100100100011,D:110101101101110,E:111100110100111,F:111100110100100,G:011100101101011,H:101101111101101,I:111010010010111,J:001001001101010,K:101101110101101,L:100100100100111,M:101111111101101,N:110101101101101,O:010101101101010,P:110101110100100,Q:010101101111011,R:110101110101101,S:011100010001110,T:111010010010010,U:101101101101111,V:101101101101010,W:101101111111101,X:101101010101101,Y:101101010010010,Z:111001010100111,0:111101101101111,1:010110010010111,2:110001010100111,3:110001010001110,4:101101111001001,5:111100110001110,6:011100111101111,7:111001010010010,8:111101111101111,9:111101111001110,!:010010010000010,-:000000111000000,(:001010010010001,):100010010010100,^:010111010010010,.:000000000000010,":":000010000010000'.split(',').forEach(s=>{F[s[0]]=s.slice(2)});
function txt(s,x,y,sc,c,al,sh){s=String(s).toUpperCase();const w=s.length*4*sc-sc;let px=al==='c'?x-w/2:al==='r'?x-w:x;
 for(const ch of s){const g=F[ch];if(g)for(let i=0;i<15;i++)if(g[i]==='1'){const X=S(px+(i%3)*sc),Y=S(y+((i/3|0)*sc));if(sh!==0){cx.fillStyle='#10163a';cx.fillRect(X+4,Y+4,sc,sc)}cx.fillStyle=c;cx.fillRect(X,Y,sc,sc)}px+=4*sc}}
// ---------- static scenery (pre-rendered)
const bgc=document.createElement('canvas');bgc.width=200;bgc.height=112;
function scene(T){
 B(0,0,800,80,T.sky[0]);B(0,80,800,80,T.sky[1]);B(0,160,800,96,T.sky[2]);if(T.night){for(let i=0;i<40;i++)B(i*53%800,i*29%200,4,4,'#fff');disc(660,70,6,'#f4f0c8');disc(676,62,5,T.sky[0])}
 if(T.cl)for(const [x,y] of[[60,60],[300,110],[520,50],[690,100]]){disc(x,y,5,T.cl);disc(x+36,y-8,7,T.cl);disc(x+72,y,5,T.cl);B(x-16,y,100,16,T.cl)}
 if(T.d==='city')for(let i=0;i<22;i++){const w=36+(i*37%3)*16,h=70+(i*53%7)*14;B(i*38-8,252-h-20,w,h+20,T.far)}
 if(T.d==='city')for(let i=0;i<14;i++){const w=44+(i*29%3)*16,h=50+(i*41%6)*14,x=i*60+10;B(x,252-h,w,h+4,T.near);B(x+w/2-2,252-h-20,4,20,T.near);for(let y=252-h+12;y<244;y+=24)B(x+8,y,8,8,T.win)}
 if(T.d==='sea'){B(0,196,800,56,'#2aa6d8');for(let i=0;i<20;i++)B(i*40+(i%2)*16,204+(i%3)*14,24,4,'#7fd6f2');B(560,148,4,40,'#fff');B(564,152,28,32,'#fff');B(548,188,52,8,'#c4543a')}
 if(T.d==='gym'){B(0,0,800,252,'#7a7f8c');for(let x=0;x<800;x+=100)B(x,0,4,252,'#6a6f7c');B(0,52,800,8,'#c0c4cc');for(let r=0;r<4;r++)for(let x=0;x<800;x+=28)B(x+2+(r%2)*14,100+r*34,22,24,'#9aa0ad')}
 if(T.d==='pines')for(let i=0;i<14;i++){const x=i*60+16;for(let k=0;k<4;k++){const w=64-k*14;B(x+32-w/2,212-k*28,w,28,'#3f7f5a');B(x+32-w/2,212-k*28,w,6,'#fff')}B(x+28,232,8,20,'#6b4a3a')}
 B(0,252,800,196,T.gr);
 for(let y=268;y<448;y+=44)B(0,y,800,22,T.st);
 if(T.fn)for(let i=0;i<67;i++){const t=200+(i*7%3)*8;B(i*12,t,8,252-t,T.fn[0]);B(i*12+8,t,4,252-t,T.fn[1])}
 if(T.hg)for(let i=0;i<50;i++)B(i*16,240+(i*5%3)*4,16,16,T.hg);
 const ln=T.ln;B(60,350,680,8,ln);B(20,410,760,8,ln);seg(60,354,20,414,2,ln);seg(740,354,780,414,2,ln);
 B(NX-16,GY+2,32,8,'rgba(0,0,0,.2)')}
function drawNet(){B(NX-4,NT,8,GY-NT+8,'#f4f4f4');for(let y=NT+8;y<GY;y+=16)B(NX-4,y,8,4,'#bfc7d0');B(NX-8,NT-4,16,8,'#fff');B(NX+4,NT,4,GY-NT+8,'#a8b0bb')}
const SN=['Random','Park','Night','Beach','Gym','Snow'];
const STG=[{sky:['#86e6f1','#94eaf3','#a6eff6'],cl:'#c9f7fa',far:'#8fdde8',near:'#74cbdb',win:'#a9ecf3',d:'city',fn:['#8a6858','#6e5144'],hg:'#78b83c',gr:'#a3d14d',st:'#98c844',ln:'#fff'},
{sky:['#2b2268','#3a2f8a','#5a4fb0'],cl:'#6a63c4',far:'#4a4aa8',near:'#3a3590',win:'#f6e27a',d:'city',night:1,fn:['#6a5a6a','#4e404e'],hg:'#3f8a3f',gr:'#4f9a4a',st:'#478f44',ln:'#dfe6ff'},
{sky:['#6fd8f6','#8fe4f8','#b4f0fb'],cl:'#e8fbff',d:'sea',gr:'#f2d38a',st:'#ecc97a',ln:'#fff'},
{sky:['#7a7f8c','#7a7f8c','#7a7f8c'],d:'gym',gr:'#d9a566',st:'#cf9a5a',ln:'#fff'},
{sky:['#bfe3f2','#cfeaf6','#e2f4fb'],cl:'#fff',d:'pines',fn:['#a08a7a','#85705f'],hg:'#dfeaf5',gr:'#f4f8ff',st:'#e6eef8',ln:'#7aa6c8'}];
function buildBG(n){const m=cx;cx=bgc.getContext('2d');cx.setTransform(.25,0,0,.25,0,0);scene(STG[n]);cx=m}buildBG(0);
// ---------- geometry & AI
function sh(p,u){const k=u?1:PS;return{x:p.x,y:GY-(62+(p.sw>=0?52*Math.sin(Math.PI*Math.min(1,p.sw/SW)):0))*k}}
function head(p,ph){const s=sh(p),a=(170-180*ph)*Math.PI/180;return{x:s.x+p.dir*L*PS*Math.cos(a),y:s.y-L*PS*Math.sin(a)}}
function tAt(h){const d=ball.vy*ball.vy+2*G*(h-ball.y);return d<0?-1:(-ball.vy+Math.sqrt(d))/G}
function cross(h,p){const t=tAt(h);if(t<=.02)return null;const x=ball.x+ball.vx*t;return(p.side?x>NX+30&&x<780:x<NX-30&&x>20)?{t,x}:null}
function aimFor(p){let c=cross(RY,p);if(c)return{x:c.x,t:c.t,gx:c.x,gy:RY,ring:true,delay:SW*.5};
 c=cross(LY,p);if(c)return{x:c.x-p.dir*76*PS,t:c.t,gx:c.x,gy:LY,ring:false,delay:SW*.85};
 c=cross(GY-R,p);return c?{x:c.x-p.dir*76*PS,t:c.t,gx:0,gy:0,ring:null,delay:SW*.85}:null}
const gs=()=>Math.random()+Math.random()+Math.random()-1.5;
// ---------- flow
function ui(){const g=state==='serve'||state==='play'||state==='point';pb.style.display=mb.style.display=g||state==='over'||state==='menu'?'block':'none';pb.style.display=g?'block':'none'}
const kn=c=>c.replace('Key','').replace('Arrow','').replace('Digit','').toUpperCase();
function load(){try{const o=JSON.parse(localStorage.getItem('ntb')||'{}');if(o.pu!==undefined)pu=o.pu;if(o.gm)gmode=o.gm;if(o.pp!==undefined)pp=o.pp;if(o.cb!==undefined)cb=o.cb;if(o.K)K=o.K;if(o.best)S2.best=o.best;if(o.st)ST=Object.assign(ST,o.st);if(o.sg!==undefined)sg=o.sg;if(o.mu!==undefined)mus=o.mu}catch(e){}}
function save(){try{localStorage.setItem('ntb',JSON.stringify({pu,gm:gmode,pp,cb,K,best:S2.best,st:ST,sg,mu:mus}))}catch(e){}}
function settings(){const r=(l,t,d,on)=>`<div class="row"><b>${l}</b><button class="o ${on?'sel':''}" data-s="${d}">${t}</button></div>`;
 ov.innerHTML=`<div class="card s"><h1>Settings</h1>${r('Mode',gmode==='streak'?'Rally streak':'Match','gm',gmode==='streak')}${r('Stage',SN[sg],'sg',sg>0)}${r('Power-ups',pu?'ON':'OFF','pu',pu)}${r('CPU personalities',pp?'ON':'OFF','pp',pp)}${r('Music',mus?'ON':'OFF','mu',mus)}${r('Colorblind mode',cb?'ON':'OFF','cb',cb)}${r('P1 button',rebind==1?'Press a key...':kn(K[1]),'k1',rebind==1)}${r('P2 button',rebind==2?'Press a key...':kn(K[2]),'k2',rebind==2)}<div class="row"><button data-a="menu">Back</button></div><p class="hint">Space always works for P1 · Esc cancels a rebind</p></div>`}
function replay(w){ts=1;if(rec.length<20){over(w);return}state='replay';ridx=0;rw=w}
function info(){const t=ST.h||1,pc=k=>Math.round((ST.k[k]||0)/t*100)+'%',row=(a,b)=>`<div class="row"><b>${a}</b><span>${b}</span></div>`;
 ov.innerHTML=`<div class="card s"><h1>Your stats</h1>${row('Matches vs CPU',ST.m+' ('+ST.w+'W / '+ST.l+'L)')}${row('Longest rally',ST.lr+' hits')}${row('Best streak',S2.best)}${row('Perfect hits',pc('PERFECT!'))}${row('Good hits',pc('GOOD'))}${row('Saves',pc('SAVE'))}${row('Early / late',pc('EARLY')+' / '+pc('LATE'))}<div class="row"><button data-a="menu">Back</button><button class="o" data-a="reset">Reset</button></div></div>`}
function overS(){state='over';ui();sfx('win');save();const n=lastN;ov.innerHTML=`<div class="card"><h1>${n} hit streak</h1><p>Best: ${S2.best}${n>0&&n>=S.best?' - new record!':''}</p><div class="row"><button data-r="1">Try again</button><button class="o" data-r="0">Main menu</button></div></div>`}
function menu(){state='menu';paused=false;rebind=0;roll(0);ui();
 ov.innerHTML=`<div class="card"><h1><i>Net</i> <b>Timing</b></h1><p>One button. Swing when the circle hits the ring.</p>
 <div class="row"><button data-m="1">1 Player vs CPU</button><button data-m="2">2 Players</button></div>
 <div class="row"><button class="o" data-a="settings">Settings</button><button class="o" data-a="info">Info</button></div>
 <p class="hint">P1: ${kn(K[1])} / Space / tap · P2: ${kn(K[2])} / tap right side<br>Controller: any button swings · Start pauses<br>Pause: P or Esc · ${gmode==='streak'?'Rally streak: keep it going!':'First to '+WIN+' wins'}</p></div>`}
function over(w){state='over';ui();sfx('win');if(mode===1&&gmode!=='streak'){ST.m++;if(w)ST.l++;else ST.w++}save();const n=names();
 ov.innerHTML=`<div class="card"><h1 style="color:${w?'#4cc3ff':'#ff4b4b'}">${mode==1?(w?'CPU wins':'You win!'):n[w]+' wins!'}</h1><p>Final score ${P[0].score} - ${P[1].score}</p>
 <div class="row"><button data-r="1">Play again</button><button class="o" data-r="0">Main menu</button></div></div>`}
function togglePause(){if(state!=='serve'&&state!=='play'&&state!=='point')return;paused=!paused;
 ov.innerHTML=paused?`<div class="card"><h1>Paused</h1><div class="row"><button data-a="resume">Resume</button><button class="o" data-a="menu">Main menu</button></div><p class="hint">P or Esc to resume</p></div>`:''}
ov.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;au();const d=b.dataset;
