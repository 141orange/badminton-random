<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Net Timing Badminton</title>
<style>
:root{--bg:#1f2b4d;--card:#1c2a4a;--fg:#fff;--ac:#ffd23f;--ink:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1226;--card:#121c38}}
:root[data-theme="dark"]{--bg:#0c1226;--card:#121c38}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:"Courier New",Courier,monospace;font-weight:700;-webkit-user-select:none;user-select:none}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#st{position:relative;touch-action:none;box-shadow:0 0 0 4px #000}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:.3em solid #fff;box-shadow:.4em .4em 0 #000;padding:1.2em 1.8em;text-align:center;max-width:80%}
h1{margin:0 0 .3em;font-size:2.4em;line-height:1;text-shadow:.07em .07em 0 #000}
h1 i{color:#ff4b4b;font-style:normal}h1 b{color:#4cc3ff}
p{margin:.3em 0 .8em;font-size:1em}
.row{display:flex;gap:.7em;justify-content:center;flex-wrap:wrap;margin:.6em 0}
button{font:inherit;font-weight:900;color:var(--ink);background:var(--ac);border:.18em solid #000;padding:.5em 1em;cursor:pointer;box-shadow:.25em .25em 0 #000}
button:active{transform:translate(.15em,.15em);box-shadow:.1em .1em 0 #000}
button.o{background:#fff}
button:focus-visible{outline:.2em solid #ff4b4b;outline-offset:.15em}
.hint{font-size:.78em;opacity:.8;margin:.8em 0 0;line-height:1.5}
.ib{position:absolute;top:.7em;width:2.6em;height:2.6em;padding:0;display:none;font-size:1em;background:#fff;box-shadow:.15em .15em 0 #000}
#pb{right:.7em}#mb{right:3.9em}
.off{text-decoration:line-through;opacity:.55}
</style></head><body>
<div id="wrap"><div id="st"><canvas id="c" width="200" height="112"></canvas><div id="ov"></div>
<button class="ib" id="mb" aria-label="Sound">♪</button><button class="ib" id="pb" aria-label="Pause">II</button></div></div>
<script>
let cx=document.getElementById('c').getContext('2d');
const cv=document.getElementById('c'),st=document.getElementById('st'),ov=document.getElementById('ov'),wrap=document.getElementById('wrap'),pb=document.getElementById('pb'),mb=document.getElementById('mb');
const W=800,H=448,GY=388,NX=400,NT=300,R=8,G=900,L=80,SW=.4,WIN=5,RY=194,LY=279,HR=46;
let mode=1,state='menu',paused=false,timer=0,server=0,shake=0,banner='',hint=0,onHit=null,onPt=null;
let P=[],ball=null,texts=[],parts=[];
const mk=s=>({side:s,dir:s?-1:1,home:s?610:190,x:s?610:190,vx:0,sw:-1,cd:0,hit:false,score:0,cpu:false,walk:0,hx:0,aim:null,plan:0,pb:-1,dm:1e9,pm:0,tk:-1,
 jc:s?'#2a9df4':'#d7262f',sk:s?'#f7c9a0':'#e3a070',hr:s?'#f2c94c':'#2b1d1a'});
P=[mk(0),mk(1)];
const names=()=>['P1',mode==1?'CPU':'P2'];
function fit(){const w=Math.min(wrap.clientWidth,wrap.clientHeight*W/H),h=w*H/W;st.style.width=w+'px';st.style.height=h+'px';st.style.fontSize=w/46+'px'}
addEventListener('resize',fit);
// ---------- audio
let AC=null,mute=false;
function au(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,ty,v,sl,dl){if(mute||!AC)return;const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);
 if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function nz(d,v,fq){if(mute||!AC)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=fq;s.buffer=b;g.gain.value=v;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}
function sfx(n,a){switch(n){
 case'swing':nz(.12,.1,1800);break;
 case'hit':if(a==='PERFECT!'){nz(.15,.25,900);tone(700,.18,'square',.08,900);tone(1400,.25,'triangle',.07,0,.08);tone(2100,.3,'triangle',.05,0,.16)}
  else if(a==='GOOD'){nz(.08,.2,1200);tone(620,.1,'square',.07,200)}else if(a==='SAVE'){nz(.08,.18,700);tone(420,.12,'triangle',.08,150)}else{nz(.1,.12,500);tone(220,.18,'sawtooth',.05,-120)}break;
 case'net':tone(110,.14,'triangle',.1,-40);nz(.08,.1,300);break;
 case'bounce':tone(150,.08,'triangle',.07,-50);break;
 case'tick':tone(1500,.03,'square',.035);break;
 case'beep':tone(660,.08,'square',.05);break;
 case'point':[523,659,784].forEach((f,i)=>tone(f,.14,'square',.06,0,i*.1));break;
 case'bad':tone(300,.25,'sawtooth',.06,-150);break;
 case'win':[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.18,'square',.07,0,i*.14))}}
// ---------- pixel helpers (world coords, snapped to 4-unit pixels; canvas is scaled 1/4)
const S=v=>Math.round(v/4)*4;
function B(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(S(x),S(y),Math.max(4,S(w)),Math.max(4,S(h)))}
function seg(x1,y1,x2,y2,w,c){cx.fillStyle=c;const n=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)/3));for(let i=0;i<=n;i++)cx.fillRect(S(x1+(x2-x1)*i/n-w*2),S(y1+(y2-y1)*i/n-w*2),w*4,w*4)}
function disc(x,y,r,c){cx.fillStyle=c;x=S(x);y=S(y);for(let dy=-r;dy<=r;dy++){const dx=Math.round(Math.sqrt(r*r+r*.8-dy*dy));cx.fillRect(x-dx*4,y+dy*4,(2*dx+1)*4,4)}}
function ringpx(x,y,r,c,dash){cx.fillStyle=c;for(let a=0,i=0;a<6.283;a+=.1,i++){if(dash&&i%2)continue;cx.fillRect(S(x+Math.cos(a)*r),S(y+Math.sin(a)*r),4,4)}}
const F={};'A:010101111101101,B:110101110101110,C:011100100100011,D:110101101101110,E:111100110100111,F:111100110100100,G:011100101101011,H:101101111101101,I:111010010010111,J:001001001101010,K:101101110101101,L:100100100100111,M:101111111101101,N:110101101101101,O:010101101101010,P:110101110100100,Q:010101101111011,R:110101110101101,S:011100010001110,T:111010010010010,U:101101101101111,V:101101101101010,W:101101111111101,X:101101010101101,Y:101101010010010,Z:111001010100111,0:111101101101111,1:010110010010111,2:110001010100111,3:110001010001110,4:101101111001001,5:111100110001110,6:011100111101111,7:111001010010010,8:111101111101111,9:111101111001110,!:010010010000010,-:000000111000000,(:001010010010001,):100010010010100,^:010111010010010,.:000000000000010,":":000010000010000'.split(',').forEach(s=>{F[s[0]]=s.slice(2)});
function txt(s,x,y,sc,c,al,sh){s=String(s).toUpperCase();const w=s.length*4*sc-sc;let px=al==='c'?x-w/2:al==='r'?x-w:x;
 for(const ch of s){const g=F[ch];if(g)for(let i=0;i<15;i++)if(g[i]==='1'){const X=S(px+(i%3)*sc),Y=S(y+((i/3|0)*sc));if(sh!==0){cx.fillStyle='#10163a';cx.fillRect(X+4,Y+4,sc,sc)}cx.fillStyle=c;cx.fillRect(X,Y,sc,sc)}px+=4*sc}}
// ---------- static scenery (pre-rendered)
const bgc=document.createElement('canvas');bgc.width=200;bgc.height=112;
function scene(){
 B(0,0,800,80,'#86e6f1');B(0,80,800,80,'#94eaf3');B(0,160,800,96,'#a6eff6');
 for(const [x,y] of[[60,60],[300,110],[520,50],[690,100]]){disc(x,y,5,'#c9f7fa');disc(x+36,y-8,7,'#c9f7fa');disc(x+72,y,5,'#c9f7fa');B(x-16,y,100,16,'#c9f7fa')}
 for(let i=0;i<22;i++){const w=36+(i*37%3)*16,h=70+(i*53%7)*14;B(i*38-8,252-h-20,w,h+20,'#8fdde8')}
 for(let i=0;i<14;i++){const w=44+(i*29%3)*16,h=50+(i*41%6)*14,x=i*60+10;B(x,252-h,w,h+4,'#74cbdb');B(x+w/2-2,252-h-20,4,20,'#74cbdb');for(let y=252-h+12;y<244;y+=24)B(x+8,y,8,8,'#a9ecf3')}
 B(0,252,800,196,'#a3d14d');
 for(let y=268;y<448;y+=44)B(0,y,800,22,'#98c844');
 for(let i=0;i<67;i++){const t=200+(i*7%3)*8;B(i*12,t,8,252-t,'#8a6858');B(i*12+8,t,4,252-t,'#6e5144')}
 for(let i=0;i<50;i++)B(i*16,240+(i*5%3)*4,16,16,'#78b83c');
 const ln='#fff';B(60,350,680,8,ln);B(20,410,760,8,ln);seg(60,354,20,414,2,ln);seg(740,354,780,414,2,ln);
 B(NX-16,GY+2,32,8,'#86b53b');B(NX-4,NT,8,GY-NT+8,'#f4f4f4');for(let y=NT+8;y<GY;y+=16)B(NX-4,y,8,4,'#bfc7d0');B(NX-8,NT-4,16,8,'#fff');B(NX+4,NT,4,GY-NT+8,'#a8b0bb')}
{const m=cx;cx=bgc.getContext('2d');cx.setTransform(.25,0,0,.25,0,0);scene();cx=m}
// ---------- geometry & AI
function sh(p){return{x:p.x,y:GY-62-(p.sw>=0?52*Math.sin(Math.PI*Math.min(1,p.sw/SW)):0)}}
function head(p,ph){const s=sh(p),a=(170-180*ph)*Math.PI/180;return{x:s.x+p.dir*L*Math.cos(a),y:s.y-L*Math.sin(a)}}
function tAt(h){const d=ball.vy*ball.vy+2*G*(h-ball.y);return d<0?-1:(-ball.vy+Math.sqrt(d))/G}
function cross(h,p){const t=tAt(h);if(t<=.02)return null;const x=ball.x+ball.vx*t;return(p.side?x>NX+30&&x<780:x<NX-30&&x>20)?{t,x}:null}
function aimFor(p){let c=cross(RY,p);if(c)return{x:c.x,t:c.t,gx:c.x,gy:RY,ring:true,delay:SW*.5};
 c=cross(LY,p);if(c)return{x:c.x-p.dir*76,t:c.t,gx:c.x,gy:LY,ring:false,delay:SW*.85};
 c=cross(GY-R,p);return c?{x:c.x-p.dir*76,t:c.t,gx:0,gy:0,ring:null,delay:SW*.85}:null}
const gs=()=>Math.random()+Math.random()+Math.random()-1.5;
// ---------- flow
function ui(){const g=state==='serve'||state==='play'||state==='point';pb.style.display=mb.style.display=g||state==='over'||state==='menu'?'block':'none';pb.style.display=g?'block':'none'}
function menu(){state='menu';paused=false;ui();
 ov.innerHTML=`<div class="card"><h1><i>Net</i> <b>Timing</b></h1><p>One button. Swing when the circle hits the ring.</p>
 <div class="row"><button data-m="1">1 Player vs CPU</button><button data-m="2">2 Players</button></div>
 <p class="hint">P1: W / Space / tap · P2: Up arrow / tap right side<br>Pause: P or Esc · First to ${WIN} wins</p></div>`}
function over(w){state='over';ui();sfx('win');const n=names();
 ov.innerHTML=`<div class="card"><h1 style="color:${w?'#4cc3ff':'#ff4b4b'}">${mode==1?(w?'CPU wins':'You win!'):n[w]+' wins!'}</h1><p>Final score ${P[0].score} - ${P[1].score}</p>
 <div class="row"><button data-r="1">Play again</button><button class="o" data-r="0">Main menu</button></div></div>`}
function togglePause(){if(state!=='serve'&&state!=='play'&&state!=='point')return;paused=!paused;
 ov.innerHTML=paused?`<div class="card"><h1>Paused</h1><div class="row"><button data-a="resume">Resume</button><button class="o" data-a="menu">Main menu</button></div><p class="hint">P or Esc to resume</p></div>`:''}
ov.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;au();const d=b.dataset;
 if(d.m){mode=+d.m;start()}else if(d.r==='1')start();else if(d.r==='0'||d.a==='menu')menu();else if(d.a==='resume')togglePause()});
pb.onclick=()=>{au();togglePause()};mb.onclick=()=>{au();mute=!mute;mb.classList.toggle('off',mute)};
function start(){const m=mode;P=[mk(0),mk(1)];P[1].cpu=m==1;server=0;hint=2;paused=false;serve()}
function serve(){state='serve';timer=.9;ui();ov.innerHTML='';for(const p of P){p.x=p.home;p.vx=0;p.sw=-1;p.cd=0;p.dm=1e9}
 ball={x:P[server].home,y:70,vx:0,vy:0,last:-1,hits:0,trail:[]};banner=''}
function press(i){if(state!=='play'||paused)return;const p=P[i];if(p.sw<0&&p.cd<=0){p.sw=0;p.hit=false;p.dm=1e9;p.pe=p.aim&&p.aim.ring!==null?p.aim.t-p.aim.delay:9;sfx('swing');if(!p.cpu&&hint>0)hint-=.5}}
addEventListener('keydown',e=>{if(e.repeat)return;au();
 if(e.code==='KeyW'||e.code==='Space'){press(0);e.preventDefault()}
 else if(e.code==='ArrowUp'){press(mode==2?1:0);e.preventDefault()}
 else if(e.code==='KeyP'||e.code==='Escape')togglePause();else if(e.code==='KeyM')mb.click()});
st.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;au();const r=st.getBoundingClientRect();press(mode==2&&e.clientX-r.left>r.width/2?1:0)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)togglePause()});
// ---------- hit & scoring
function doHit(p,ph){
 const e=p.pe;p.hit=true;p.dm=1e9;ball.last=p.side;ball.hits++;
 const d=p.dir,x0=ball.x,y0=ball.y,rr=Math.random,far=(a,b)=>NX+d*(a+rr()*(b-a));
 let k,c='#fff';
 const gate=(xl,Tg)=>{let gx=xl-150,vx,vy;for(let i=0;i<5;i++){gx=NX+d*Math.max(40,d*(gx-NX));vx=(gx-x0)/Tg;vy=(RY-y0-.5*G*Tg*Tg)/Tg;const vg=vy+G*Tg,tf=(-vg+Math.sqrt(vg*vg+2*G*(GY-R-RY)))/G;gx=xl-vx*tf}
  gx=NX+d*Math.max(40,d*(gx-NX));ball.vx=(gx-x0)/Tg;ball.vy=(RY-y0-.5*G*Tg*Tg)/Tg};
 if(y0>258){k='SAVE';c='#9be7ff';gate(far(130,330),1.2)}
 else if(Math.abs(e)<.045){k='PERFECT!';c='#ffd23f';gate(far(130,350),.56)}
 else if(Math.abs(e)<.085){k='GOOD';c='#b6f2a0';gate(far(110,340),.95)}
 else if(e<0||(e>8&&ph<.5)){k='LATE';c='#ff9f7a';const T=1;ball.vx=(far(8,70)-x0)/T;ball.vy=(GY-R-y0-.5*G*T*T)/T}
 else{k='EARLY';c='#ff9f7a';const T=.8;ball.vx=(NX+d*(390+rr()*60)-x0)/T;ball.vy=(GY-R-y0-.5*G*T*T)/T}
 if(onHit)onHit(k);sfx('hit',k);
 texts.push({x:x0,y:y0-30,t:0,s:k,c,z:k==='PERFECT!'?3:2});
 if(k==='PERFECT!')shake=12;
 for(let i=0;i<(k==='PERFECT!'?24:9);i++){const a=rr()*6.28,s=80+rr()*260;parts.push({x:x0,y:y0,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5,c})}}
function land(){const x=ball.x,inb=x>=40&&x<=760,w=inb?(x<NX?1:0):(ball.last>=0?1-ball.last:1-server);
 P[w].score++;server=w;state='point';timer=1.5;shake=8;if(onPt)onPt(ball.hits,!inb);
 banner=(inb?'':'OUT! ')+(mode==1?(w?'CPU SCORES':'YOU SCORE'):names()[w]+' SCORES');sfx(mode==1&&w?'bad':'point');
 for(let i=0;i<14;i++)parts.push({x:ball.x,y:GY-4,vx:(Math.random()-.5)*240,vy:-Math.random()*200,l:.6,c:'#fff'})}
// ---------- simulation
function step(dt){
 if(paused)return;
 shake=Math.max(0,shake-dt*30);
 for(const t of texts)t.t+=dt;texts=texts.filter(t=>t.t<.9);
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;q.l-=dt}parts=parts.filter(q=>q.l>0);
 if(state==='menu'||state==='over')return;
 if(state==='serve'){timer-=dt;if(timer<=0){state='play';sfx('beep')}}
 else if(state==='point'){timer-=dt;if(timer<=0){const w=P[0].score>=WIN?0:P[1].score>=WIN?1:-1;if(w>=0)over(w);else serve()}}
 for(const p of P){
  p.aim=null;let tx=p.home;
  if(state==='play'&&ball.last!==p.side&&ball.y<GY-R-2){const a=aimFor(p);if(a){p.aim=a;tx=a.x}}
  tx=p.side?Math.min(Math.max(tx,NX+45),755):Math.min(Math.max(tx,45),NX-45);
  const v=Math.max(-330,Math.min(330,(tx-p.x)*10));
  p.vx+=(v-p.vx)*Math.min(1,dt*14);p.x+=p.vx*dt;p.walk+=Math.abs(p.vx)*dt*.06;p.hx+=(-p.vx*.03-p.hx)*Math.min(1,dt*8);
  if(p.sw>=0){p.sw+=dt;if(p.sw>=SW){if(!p.hit&&p.dm<1e9&&state==='play')doHit(p,p.pm);p.sw=-1;p.cd=.12}}else if(p.cd>0)p.cd-=dt;
  if(p.aim&&state==='play'){const e=p.aim.t-p.aim.delay;
   if(!p.cpu&&p.aim.ring!==null&&e<=0&&p.tk!==ball.hits){p.tk=ball.hits;if(e>-.06)sfx('tick')}
   if(p.cpu&&p.sw<0&&p.cd<=0){if(p.pb!==ball.hits){p.pb=ball.hits;p.plan=gs()*(ball.hits?.2:.1)}
    if(Math.abs(p.x-p.aim.x)<50&&e<=p.plan)press(p.side)}}}
 if(state==='play'||state==='point'){
  ball.vy+=G*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>14)ball.trail.shift();
  const cxp=Math.max(NX-4,Math.min(NX+4,ball.x)),cyp=Math.max(NT,Math.min(GY,ball.y)),dx=ball.x-cxp,dy=ball.y-cyp,d=Math.hypot(dx,dy);
  if(d<R){const nx=d?dx/d:(ball.x<NX?-1:1),ny=d?dy/d:0;ball.x=cxp+nx*R;ball.y=cyp+ny*R;const vn=ball.vx*nx+ball.vy*ny;
   if(vn<0){ball.vx-=1.35*vn*nx;ball.vy-=1.35*vn*ny;shake=Math.max(shake,4);sfx('net')}}
  if(ball.y>=GY-R){ball.y=GY-R;if(state==='play')land();else if(Math.abs(ball.vy)>80)sfx('bounce');ball.vy*=-.45;ball.vx*=.7;if(Math.abs(ball.vy)<40)ball.vy=0}
  if(ball.y===GY-R)ball.vx*=1-dt*3;
  if(state==='play'&&(ball.x<-80||ball.x>W+80))land();
  if(state==='play')for(const p of P){
   if(p.sw<0||p.hit||ball.last===p.side||!(p.side?ball.x>NX-40:ball.x<NX+40))continue;
   const ph=p.sw/SW,h=head(p,ph),dd=Math.hypot(h.x-ball.x,h.y-ball.y);
   if(ph>.08&&dd<HR+R+(ball.hits?0:16)){if(dd<=p.dm){p.dm=dd;p.pm=ph}else doHit(p,p.pm)}else if(p.dm<1e9)doHit(p,p.pm)}
 }
}
// ---------- drawing
function drawPlayer(p){
 const s=sh(p),jump=GY-62-s.y,foot=GY-jump,hip={x:p.x,y:foot-32},sho={x:p.x+p.vx*.035,y:s.y},hd={x:sho.x+p.hx,y:sho.y-18},d=p.dir,air=jump>1;
 B(p.x-20,GY+4,40,8,'#7fae3a');
 for(const o of[-1,1]){const fx=p.x+(air?o*14:o*Math.sin(p.walk)*12),fy=foot-(air?(o>0?10:2):Math.max(0,Math.cos(p.walk)*o*6));
  seg(hip.x,hip.y,fx,fy,2,p.sk);B(fx-6+d*4,fy-4,16,8,'#1c1c1c')}
 B(hip.x-12,hip.y-10,24,16,'#fff');
 seg(hip.x,hip.y-8,sho.x,sho.y,3,p.jc);seg(hip.x,hip.y-14,sho.x,sho.y+6,1,'#fff');
